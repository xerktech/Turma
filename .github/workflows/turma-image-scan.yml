name: scan-turma-image

# On PRs to main that touch the /turma build context, build the image
# locally (no push) and scan it for OS/library CVEs and leaked secrets with
# Trivy. Pre-merge counterpart to build-turma-image.yml (push only on main).
#
# Runs on GitHub-hosted `ubuntu-latest`; Trivy installed from its release
# tarball, no SARIF upload (no GHAS — findings live in the job log and
# --exit-code is the gate).
on:
  pull_request:
    branches: [main]
    paths:
      - "turma/**"
      - ".trivyignore"
      - ".github/workflows/turma-image-scan.yml"

concurrency:
  group: turma-image-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # Hosted. This job builds an image, but off the `type=gha` cache below rather
    # than a warm local one, and the turma image is a small node app — the disk
    # pressure that shaped the agent scan next door was never this job's problem.
    # As a PR gate it's also the job that hurt most in the box's 3-job queue,
    # since it blocks a merge.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Per-run tag. The runner is now a fresh VM per job, so this no longer has
      # to stop concurrent scans from clobbering each other's image — but it
      # still names the run a scan's output came from.
      SCAN_TAG: local/turma:pr-${{ github.run_id }}
      # Job-level so the cache key and the install step share one source of
      # truth; bump this and the cache misses, downloads once, re-primes.
      TRIVY_VERSION: "0.70.0"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build turma image (local, no push)
        uses: docker/build-push-action@v7
        with:
          context: ./turma
          load: true
          push: false
          tags: ${{ env.SCAN_TAG }}
          # Share the turma image's cache scope with the build workflow so the
          # PR scan and the post-merge build prime each other's layer cache.
          cache-from: type=gha,scope=turma
          cache-to: type=gha,mode=max,scope=turma

      # Reuse the trivy binary across runs, keyed on the pinned version. A good
      # download is saved to the actions cache and restored here, so the release
      # CDN is touched once per version bump instead of every scan (XERK-283) —
      # which also removes ~7s from the common path.
      - name: Cache Trivy binary
        id: trivy-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          BIN="$HOME/.local/bin/trivy"
          URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          if [ -x "$BIN" ]; then
            echo "trivy restored from cache"
          else
            mkdir -p "$HOME/.local/bin"
            # Download+extract with exponential backoff over minutes, not seconds.
            # The release CDN has bad patches that last minutes (XERK-283); the old
            # 3×5s ladder burned through inside one and failed clean PRs. Six
            # attempts spread over ~4.5 min wait a patch out instead. Retrying the
            # whole extract (not just curl --retry) also proves the archive is whole
            # — the download has been seen arriving truncated with a 200 status,
            # which curl alone can't catch.
            ok=
            for delay in 0 5 15 45 90 120; do
              if [ "$delay" -gt 0 ]; then
                echo "trivy download/extract failed; retrying in ${delay}s"
                sleep "$delay"
              fi
              if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/trivy.tgz "$URL" \
                 && tar -xzf /tmp/trivy.tgz -C "$HOME/.local/bin" trivy; then
                ok=1
                break
              fi
            done
            if [ -z "$ok" ]; then
              echo "::error::Trivy download exhausted all retries — likely a transient CDN outage, re-run the job (XERK-283)"
              exit 1
            fi
            chmod +x "$BIN"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$BIN" --version

      # TMPDIR/--cache-dir → runner.temp for Trivy's uncompressed-layer scratch
      # export. On the self-hosted box this kept it off the runner container's
      # small /tmp; on a hosted runner /tmp and runner.temp share the one root
      # volume, so it's now belt-and-braces rather than load-bearing — kept
      # because it costs nothing.
      - name: Trivy image scan
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          trivy image "$SCAN_TAG" \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --cache-dir "${RUNNER_TEMP}/trivy-cache" \
            --exit-code 1 \
            --no-progress
