name: bug-fix-gate

# Proves that a PR's tests actually pin the behaviour it changed.
#
# The rule this enforces: a test that would have passed BEFORE the fix does not
# prove the fix. So for every test file a PR adds or changes, this runs that
# test against the merge-base with only the test files overlaid — the fix itself
# absent — and requires it to FAIL there, then requires it to PASS on the head.
#
# Why it exists: Bug tickets filed by a QA pass are carried to a merge without a
# human reading the diff, and "CI is green" cannot distinguish a fix that works
# from a fix whose test never exercised it. This check is the evidence that
# distinguishes them, and the local `gh pr merge` gate refuses to merge a Bug PR
# unless it is green.
#
# It is deliberately NOT a required status check. A human merging by hand is the
# judgement this gate stands in for, so a red result here is information for a
# person, not a block — a refactor with no behavioural delta legitimately has no
# regression test to prove. Automation is the only consumer that must obey it.
#
# NOT path-filtered, on purpose: it must report on every PR so the merge gate can
# always read a conclusion rather than an absent check. A PR that changes no test
# files passes with "no proof available" recorded in the summary.
#
# Known limit, recorded so nobody reads more into a pass than it carries: on the
# compiled and type-checked components (android, glasses, veiller) a test that
# references a symbol the fix introduces fails on the base by failing to BUILD,
# not by failing an assertion. That still proves the test reaches new code, but
# it does not prove the assertion discriminates. The summary labels which kind of
# failure each proof got — read `weak (build error)` as "a person should look".

on:
  pull_request:
    branches: [main]

concurrency:
  group: bug-fix-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof:
    name: Regression test proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Which test files the PR touches, bucketed by the runner each needs, so
      # the toolchain steps below install only what this PR actually exercises.
      - name: Detect changed test files
        id: detect
        # Every `${{ }}` reaches these scripts through `env:`, never spliced into
        # the script text — that is `run-shell-injection`, which code-scan runs
        # over every workflow in this repo.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # Added/copied/modified/renamed only — a deleted test cannot be proven.
          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD)"

          bucket() { echo "$CHANGED" | grep -E "$1" || true; }
          PY="$(bucket '^agent/tests/test_[^/]+\.py$')"
          NODE="$(bucket '^(turma/tests|agent/tests|\.github/scripts/tests)/[^/]+\.test\.js$')"
          SH="$(bucket '^agent/tests/[^/]+\.sh$')"
          GLASSES="$(bucket '^glasses/.*\.test\.ts$')"
          VEILLER="$(bucket '^veiller/.*\.test\.ts$')"
          ANDROID="$(bucket '^android/.*Test\.kt$')"

          for n in PY NODE SH GLASSES VEILLER ANDROID; do
            v="${!n}"
            {
              echo "${n,,}<<EOF"
              echo "$v"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            [ -n "$v" ] && echo "${n,,}_any=true" >> "$GITHUB_OUTPUT" || echo "${n,,}_any=false" >> "$GITHUB_OUTPUT"
          done

          if [ -z "$PY$NODE$SH$GLASSES$VEILLER$ANDROID" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No proof available
        if: steps.detect.outputs.any == 'false'
        run: |
          {
            echo "### Regression test proof — none available"
            echo
            echo "This PR changes no test files, so there is nothing to prove against the base."
            echo "Automation treats that as **not eligible for unattended merge**; a human merge is unaffected."
          } >> "$GITHUB_STEP_SUMMARY"

      # The base tree with ONLY the PR's test files overlaid. Everything else —
      # the fix — stays at the merge-base, which is what makes the run below a
      # proof rather than a re-run.
      - name: Build the base-with-tests tree
        if: steps.detect.outputs.any == 'true'
        env:
          BASE: ${{ steps.detect.outputs.base }}
          # ONLY the detected test files. Overlaying every changed file would
          # carry the fix across too and the "fails on base" run would prove
          # nothing — that is the whole point of this tree.
          TESTS: |
            ${{ steps.detect.outputs.py }}
            ${{ steps.detect.outputs.node }}
            ${{ steps.detect.outputs.sh }}
            ${{ steps.detect.outputs.glasses }}
            ${{ steps.detect.outputs.veiller }}
            ${{ steps.detect.outputs.android }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/base "$BASE"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "/tmp/base/$(dirname "$f")"
            git show "HEAD:$f" > "/tmp/base/$f"
            chmod --reference="$f" "/tmp/base/$f"
          done <<< "$TESTS"

      - uses: actions/setup-python@v6
        if: steps.detect.outputs.py_any == 'true'
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.node_any == 'true' || steps.detect.outputs.glasses_any == 'true'
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        if: steps.detect.outputs.veiller_any == 'true'

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.android_any == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.android_any == 'true'
        with:
          gradle-version: '8.11.1'

      # Runs each bucket twice: on the overlaid base (must fail) and on the head
      # (must pass). A bucket that passes on the base is the finding this whole
      # workflow exists to surface — the test does not discriminate the fix.
      - name: Prove
        if: steps.detect.outputs.any == 'true'
        env:
          PY: ${{ steps.detect.outputs.py }}
          NODE: ${{ steps.detect.outputs.node }}
          SH: ${{ steps.detect.outputs.sh }}
          GLASSES: ${{ steps.detect.outputs.glasses }}
          VEILLER: ${{ steps.detect.outputs.veiller }}
          ANDROID: ${{ steps.detect.outputs.android }}
        run: |
          set -uo pipefail
          FAILED=0
          {
            echo "### Regression test proof"
            echo
            echo "| suite | on base (want: fail) | on head (want: pass) | verdict |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Classifies a base failure. A build/import error proves the test
          # reaches new code but not that its assertion discriminates. A timeout
          # is not a clean signal at all — a suite run against source that lacks
          # the fix can leave a handle open and never exit (observed on
          # turma/tests/server.test.js), so it is reported, never silently
          # counted as a good failure.
          # Order matters. A build error is checked first because it makes every
          # later signal meaningless. Real assertion failures beat a timeout,
          # because a suite that failed 19 assertions and THEN hung on an open
          # handle did discriminate — the hang is a property of running new tests
          # against old source, not an absence of proof.
          classify() {
            if grep -qiE 'cannot find symbol|unresolved reference|compilation (error|failed)|ModuleNotFoundError|ImportError|Cannot find module|error TS[0-9]+|SyntaxError' "$1"; then
              echo "weak (build error)"
            elif grep -qE '^not ok |AssertionError|FAILED \(|^FAIL |Expected .* to' "$1"; then
              [ "$2" -eq 124 ] && echo "assertion (then hung)" || echo "assertion"
            elif [ "$2" -eq 124 ]; then
              echo "weak (timed out, no failures seen)"
            else
              echo "assertion"
            fi
          }

          # Every run is bounded: an unbounded hang would burn the whole job
          # timeout and then report as an ambiguous failure.
          run_bounded() { timeout --kill-after=30s "${PROOF_TIMEOUT:-900}" bash -c "$1"; }

          prove() {
            local label="$1" cmd="$2"
            local baselog="/tmp/${label}.base.log" headlog="/tmp/${label}.head.log"

            ( cd /tmp/base && run_bounded "$cmd" ) > "$baselog" 2>&1
            local basecode=$?
            ( cd "$GITHUB_WORKSPACE" && run_bounded "$cmd" ) > "$headlog" 2>&1
            local headcode=$?

            local basecell headcell verdict
            if [ $basecode -ne 0 ]; then basecell="failed — $(classify "$baselog" $basecode)"; else basecell="**PASSED**"; fi
            if [ $headcode -eq 0 ]; then headcell="passed"; elif [ $headcode -eq 124 ]; then headcell="**TIMED OUT**"; else headcell="**FAILED**"; fi

            if [ $basecode -ne 0 ] && [ $headcode -eq 0 ]; then
              verdict="proven"
            else
              verdict="**NOT PROVEN**"
              FAILED=1
            fi
            echo "| \`$label\` | $basecell | $headcell | $verdict |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$verdict" != "proven" ]; then
              echo "::group::$label — base run"; cat "$baselog"; echo "::endgroup::"
              echo "::group::$label — head run"; cat "$headlog"; echo "::endgroup::"
            fi
          }

          if [ -n "$PY" ]; then
            mods="$(echo "$PY" | sed 's|^agent/tests/||; s|\.py$||' | tr '\n' ' ')"
            prove python "cd agent/tests && python3 -m unittest $mods"
          fi

          if [ -n "$NODE" ]; then
            prove node "node --test $(echo "$NODE" | tr '\n' ' ')"
          fi

          if [ -n "$SH" ]; then
            for f in $SH; do prove "sh-$(basename "$f" .sh)" "./$f"; done
          fi

          if [ -n "$GLASSES" ]; then
            specs="$(echo "$GLASSES" | sed 's|^glasses/||' | tr '\n' ' ')"
            ( cd glasses && npm ci ) > /dev/null 2>&1
            ( cd /tmp/base/glasses && npm ci ) > /dev/null 2>&1
            prove glasses "cd glasses && npx vitest run $specs"
          fi

          if [ -n "$VEILLER" ]; then
            specs="$(echo "$VEILLER" | sed 's|^veiller/||' | tr '\n' ' ')"
            ( cd veiller && bun install ) > /dev/null 2>&1
            ( cd /tmp/base/veiller && bun install ) > /dev/null 2>&1
            prove veiller "cd veiller && bun test $specs"
          fi

          if [ -n "$ANDROID" ]; then
            # Gradle selects by test CLASS, not by path. The pattern is quoted
            # because it reaches the shell through `eval` and `*.Foo` would glob.
            filters="$(echo "$ANDROID" | sed 's|.*/||; s|\.kt$||' | sed "s|^|--tests '*.|; s|$|'|" | tr '\n' ' ')"
            prove android "cd android && gradle --no-daemon :app:testDebugUnitTest --rerun $filters"
          fi

          {
            echo
            if [ $FAILED -eq 0 ]; then
              echo "Every changed test fails without the fix and passes with it."
            else
              echo "**At least one suite is not proven.** A suite that PASSES on the base does not"
              echo "pin the behaviour this PR changes — the fix could be reverted and the test would"
              echo "still be green. Not eligible for unattended merge."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED
